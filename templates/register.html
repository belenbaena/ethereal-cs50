{% extends "layout.html" %}
{% block title %}Create Account — ETHEREAL{% endblock %}
{% block main %}
<section class="auth-shell">
    <div class="auth-card">
        <p class="eyebrow">ENTER THE UNIVERSE</p>
        <h1>Create your account.</h1>
        <form method="post" class="auth-form">
            <label>Name<input name="name" autocomplete="name" required></label>
            <label>Email<input type="email" name="email" autocomplete="email" required></label>
            <label>Password<input type="password" name="password" autocomplete="new-password" required></label>
            <label>Confirm password<input type="password" name="confirmation" autocomplete="new-password" required></label>
            <button class="button primary full" type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
    </div>
</section>
{% endblock %}
